
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্মার্ট ফিন্যান্স ও ওয়াইফাই ম্যানেজার</title>
    
    <!-- কাস্টম অ্যাপ আইকন -->
    <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/heroicons:wallet.svg">
    <link rel="apple-touch-icon" href="https://api.iconify.design/heroicons:wallet.svg">
    <meta name="theme-color" content="#1a56db">

    <!-- PWA Manifest Configuration -->
    <link rel="manifest" href='data:application/json,{"name":"Smart Finance App","short_name":"FinanceApp","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#1a56db","icons":[{"src":"https://api.iconify.design/heroicons:wallet.svg","sizes":"192x192","type":"image/svg+xml"}]}'>

    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- হেডার বার -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <i class="fas fa-wallet text-2xl"></i>
            <h1 class="text-xl font-bold">স্মার্ট ফিন্যান্স ও ওয়াইফাই ম্যানেজার</h1>
        </div>
        <div class="flex items-center space-x-2">
            <!-- অ্যাপ ইনস্টল বাটন -->
            <button id="installAppBtn" class="hidden bg-green-500 hover:bg-green-600 text-white font-bold px-3 py-1.5 rounded-lg text-sm shadow flex items-center space-x-1 animate-pulse">
                <i class="fas fa-download"></i>
                <span>অ্যাপ ইনস্টল</span>
            </button>
            <button onclick="exportData()" class="bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded text-sm"><i class="fas fa-download mr-1"></i> ব্যাকআপ</button>
            <button onclick="document.getElementById('importFile').click()" class="bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded text-sm"><i class="fas fa-upload mr-1"></i> রিস্টোর</button>
            <input type="file" id="importFile" class="hidden" onchange="importData(event)">
        </div>
    </header>

    <!-- নেভিগেশন ট্যাব -->
    <nav class="bg-white shadow border-b">
        <div class="max-w-4xl mx-auto flex overflow-x-auto text-sm font-semibold">
            <button onclick="switchTab('dashboard')" class="tab-btn p-3 border-b-2 border-blue-600 text-blue-600 flex items-center space-x-2 whitespace-nowrap"><i class="fas fa-chart-pie"></i><span>ড্যাশবোর্ড</span></button>
            <button onclick="switchTab('income')" class="tab-btn p-3 border-b-2 border-transparent text-gray-600 flex items-center space-x-2 whitespace-nowrap"><i class="fas fa-money-bill-wave"></i><span>দৈনিক আয়</span></button>
            <button onclick="switchTab('expense')" class="tab-btn p-3 border-b-2 border-transparent text-gray-600 flex items-center space-x-2 whitespace-nowrap"><i class="fas fa-receipt"></i><span>দৈনিক ব্যয়</span></button>
            <button onclick="switchTab('wifi')" class="tab-btn p-3 border-b-2 border-transparent text-gray-600 flex items-center space-x-2 whitespace-nowrap"><i class="fas fa-wifi"></i><span>গ্রাহক ও বিল</span></button>
            <button onclick="switchTab('savings')" class="tab-btn p-3 border-b-2 border-transparent text-gray-600 flex items-center space-x-2 whitespace-nowrap"><i class="fas fa-piggy-bank"></i><span>সঞ্চয়</span></button>
            <button onclick="switchTab('reminders')" class="tab-btn p-3 border-b-2 border-transparent text-gray-600 flex items-center space-x-2 whitespace-nowrap"><i class="fas fa-bell"></i><span>রিমাইন্ডার</span></button>
            <button onclick="switchTab('reports')" class="tab-btn p-3 border-b-2 border-transparent text-gray-600 flex items-center space-x-2 whitespace-nowrap"><i class="fas fa-chart-line"></i><span>রিপোর্টস</span></button>
        </div>
    </nav>

    <!-- মূল কনটেন্ট -->
    <main class="max-w-4xl mx-auto p-4 space-y-6">

        <!-- সামারি কার্ডস (Dashboard) -->
        <div id="tab-dashboard" class="tab-content space-y-6">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-500">
                    <p class="text-xs text-gray-500 font-bold">বর্তমান ব্যালেন্স</p>
                    <p id="totalBalance" class="text-xl font-extrabold text-gray-800">৳ ০</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow border-l-4 border-green-500">
                    <p class="text-xs text-gray-500 font-bold">মোট আয়</p>
                    <p id="totalIncome" class="text-xl font-extrabold text-green-600">৳ ০</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow border-l-4 border-red-500">
                    <p class="text-xs text-gray-500 font-bold">মোট খরচ</p>
                    <p id="totalExpense" class="text-xl font-extrabold text-red-600">৳ ০</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow border-l-4 border-yellow-500">
                    <p class="text-xs text-gray-500 font-bold">মোট সঞ্চয়</p>
                    <p id="totalSavings" class="text-xl font-extrabold text-yellow-600">৳ ০</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow border-l-4 border-emerald-500">
                    <p class="text-xs text-gray-500 font-bold">মোট পাওনা</p>
                    <p id="totalReceivable" class="text-xl font-extrabold text-emerald-600">৳ ০</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow border-l-4 border-orange-500">
                    <p class="text-xs text-gray-500 font-bold">মোট দেনা</p>
                    <p id="totalPayable" class="text-xl font-extrabold text-orange-600">৳ ০</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow border-l-4 border-indigo-500">
                    <p class="text-xs text-gray-500 font-bold">আজকের আয় / খরচ</p>
                    <p id="todayFinance" class="text-xl font-extrabold text-indigo-600">৳ ০ / ৳ ০</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow border-l-4 border-purple-500">
                    <p class="text-xs text-gray-500 font-bold">বকেয়া WiFi গ্রাহক</p>
                    <p id="dueWifiUsers" class="text-xl font-extrabold text-purple-600">০ জন</p>
                </div>
            </div>
        </div>

    </main>

    <!-- PWA Install Trigger & Logic -->
    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });

        installBtn.addEventListener('click', () => {
            installBtn.classList.add('hidden');
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(() => {
                deferredPrompt = null;
            });
        });

        function switchTab(tabName) {
            console.log("Switching to tab: " + tabName);
        }
        function exportData() { alert("ব্যাকআপ নেওয়া হচ্ছে..."); }
        function importData(e) { alert("রিস্টোর করা হচ্ছে..."); }
    </script>
</body>
</html>
